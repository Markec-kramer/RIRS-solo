name: CI/CD

on:
  push:
    branches: ["main", "production"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/rirs-solo

jobs:
  build:
    name: Build (Next.js) + artifacts
    runs-on: ubuntu-latest
    env:
      # Dummy value just so Prisma can read env("DATABASE_URL") during generate in CI
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Prisma
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            prisma
            package.json
            package-lock.json
            next.config.mjs

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Opcijsko: če ti to naredi coverage/lcov.info, bo Sonar vzel coverage metriko.
      # Če ne, analysis vseeno uspe.
      - name: Run tests with coverage (optional)
        run: npm test -- --coverage
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

  quality-gate:
    name: Quality Gate (API) - enforce on Production
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Check Quality Gate status via SonarCloud API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # enforce gate only for production branch
          if [ "$BRANCH" != "production" ]; then
            echo "Not production branch ($BRANCH) -> skipping enforcement."
            exit 0
          fi

          echo "Checking SonarCloud Quality Gate for projectKey=$PROJECT_KEY (branch=$BRANCH)"

          # poll a few times because analysis can take a moment to be available
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS -u "$SONAR_TOKEN:" \
              "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY&branch=$BRANCH")

            STATUS=$(echo "$RESP" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')

            echo "Attempt $i: status='$STATUS'"

            if [ "$STATUS" = "OK" ]; then
              echo "✅ Quality Gate OK -> Production may proceed."
              exit 0
            fi

            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "WARN" ]; then
              echo "❌ Quality Gate not OK ($STATUS) -> blocking Production."
              exit 1
            fi

            # if status is empty/unknown, wait a bit and retry
            sleep 5
          done

          echo "❌ Could not read Quality Gate status after retries -> blocking Production."
          exit 1

  docker:
    name: Docker build + push (dev/prod)
    runs-on: ubuntu-latest
    needs: [build, quality-gate]
    if: github.event_name == 'push'

    # main -> Development, production -> Production (Production ima required reviewers)
    environment: ${{ github.ref_name == 'production' && 'Production' || 'Development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Set image tag (dev/prod)
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "TAG=prod" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (dev/prod tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Render (dev - main only)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref_name == 'main'

    environment: Development

    steps:
      - name: Trigger Render deploy hook (if set)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping."
            exit 0
          fi
          curl -X POST "$HOOK"
